name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          npm_version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$npm_version" ]; then
            echo "Tag must match package.json (v$npm_version)" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish extension
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          # Trusted publishing needs an existing package, so the first version may be published by hand.
          if npm view "$spec" version >/dev/null 2>&1; then
            echo "$spec is already on npm"
          elif [[ "${spec##*@}" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

  release:
    needs: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Release metadata
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG%%+*}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
